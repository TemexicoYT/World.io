<!DOCTYPE html>
<html>
<head>
    <title>World.io</title>
    <link rel="apple-touch-icon" href="IMG_4077.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Force body to take up the entire screen with zero margins */
        html, body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fullscreen Game Container */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 185vh; /* Maintains your 1.85 aspect ratio */
            max-height: 54.05vw;
            background-color: #222;
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Loading Screen covers 100% of the container */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            z-index: 10;
        }

        #loadingScreen img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image fills the screen perfectly without distortion */
            display: block;
        }

        /* Canvas covers 100% of the container identically */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* Style for the video popup container */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        
        #videoOverlay video {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
        }

        /* Style for the IMG_4459 random popup overlay */
        #imagePopupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #imagePopupOverlay img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- SHARED CONTAINER -->
    <div id="gameContainer">
        
        <!-- LOADING SCREEN -->
        <div id="loadingScreen">
            <img src="IMG_4077.jpeg" alt="World.io Loading Screen">
        </div>

        <!-- GAME CANVAS -->
        <canvas id="gameCanvas" width="800" height="432"></canvas>
    </div>

    <!-- AUDIO ELEMENT (Animusic - Pogo Sticks) -->
    <audio id="bgMusic" loop>
        <source src="pogosticks.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- VIDEO POPUP ELEMENT (Two separate videos for clean sequential playback) -->
    <div id="videoOverlay">
        <video id="video1" controls>
            <source src="ScreenRecording_08-17-2026 13-43-19_1.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
        <video id="video2" style="display: none;" controls>
            <source src="ScreenRecording_08-20-2026 20-30-33_1.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- RANDOM IMAGE POPUP ELEMENT (IMG_4459) -->
    <div id="imagePopupOverlay">
        <img id="popupImage" src="IMG_4459.jpeg" alt="Game Status Popup">
    </div>

    <script>
        // Common Countries Database
        const commonCountries = [
            { name: "Malta", weight: 999, maxWeight: 1000, rarity: "Common" },
            { name: "Vatican City", weight: 985, maxWeight: 1000, rarity: "Common" },
            { name: "San Marino", weight: 975, maxWeight: 1000, rarity: "Common" },
            { name: "Nauru", weight: 960, maxWeight: 1000, rarity: "Common" },
            { name: "Liechtenstein", weight: 950, maxWeight: 1000, rarity: "Common" },
            { name: "Marshall Islands", weight: 935, maxWeight: 1000, rarity: "Common" },
            { name: "The Maldives", weight: 925, maxWeight: 1000, rarity: "Common" },
            { name: "Tuvalu", weight: 900, maxWeight: 1000, rarity: "Common" },
            { name: "St. Kitts and Nevis", weight: 875, maxWeight: 1000, rarity: "Common" },
            { name: "Fiji", weight: 850, maxWeight: 1000, rarity: "Common" },
            { name: "Lesotho", weight: 800, maxWeight: 1000, rarity: "Common" },
            { name: "Vanuatu", weight: 750, maxWeight: 1000, rarity: "Common" }
        ];

        let gameStarted = false;

        function startGameAndMedia(e) {
            if (gameStarted) return;
            gameStarted = true;

            // Hide the loading screen
            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) loadingScreen.style.display = 'none';

            // Play Animusic Background Music
            const music = document.getElementById('bgMusic');
            music.play().catch(err => {
                console.log("Audio play blocked or failed:", err);
            });

            // Show Overlay and Play Video 1
            const videoOverlay = document.getElementById('videoOverlay');
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            
            videoOverlay.style.display = 'flex';
            
            video1.play().catch(err => {
                console.log("Video 1 autoplay prevented:", err);
            });

            // When Video 1 ends, hide it and play Video 2
            video1.onended = () => {
                console.log("Video 1 ended. Starting Video 2...");
                video1.style.display = 'none';
                video2.style.display = 'block';
                video2.play().catch(err => {
                    console.log("Video 2 autoplay prevented:", err);
                });
            };

            // When Video 2 ends, check chance and show IMG_4460 or close overlay
            video2.onended = () => {
                console.log("Video 2 ended.");
                videoOverlay.style.display = 'none';

                // 999/1000 chance calculation (Random number between 1 and 1000)
                const roll = Math.floor(Math.random() * 1000) + 1;
                
                if (roll <= 999) {
                    console.log("Rolled a " + roll + ". Showing IMG_4460 popup.");
                    const imagePopupOverlay = document.getElementById('imagePopupOverlay');
                    imagePopupOverlay.style.display = 'flex';
                } else {
                    console.log("Rolled a " + roll + ". Skipping popup.");
                }
            };
        }

        // Handle clicking the IMG_4460 popup overlay
        document.getElementById('imagePopupOverlay').addEventListener('click', () => {
            alert("Game still in progress");
            document.getElementById('imagePopupOverlay').style.display = 'none';
        });

        // Listen for the first click or touch anywhere on the page
        document.addEventListener('click', startGameAndMedia, { once: true });
        document.addEventListener('touchstart', startGameAndMedia, { once: true });
    </script>
</body>
</html>
