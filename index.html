<!DOCTYPE html>
<html>
<head>
    <title>World.io</title>
    <link rel="apple-touch-icon" href="IMG_4461.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Force body to take up the entire screen with zero margins */
        html, body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fullscreen Game Container */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 185vh; /* Maintains your 1.85 aspect ratio */
            max-height: 54.05vw;
            background-color: #222;
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Screen Wrapper Styles */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sign In Button on IMG_4461 */
        #signInBtn {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 11;
        }

        /* Three Input Bars on IMG_4462 (Positioned right below text, separated) */
        .custom-input {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 14px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid white;
            color: white;
            border-radius: 8px;
            width: 70%;
            max-width: 300px;
            text-align: center;
            z-index: 11;
            outline: none;
        }

        #textInput1 { top: 38%; }
        #textInput2 { top: 48%; }
        #textInput3 { top: 58%; }

        /* Error Message Style */
        #errorMessage {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            color: red;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            z-index: 11;
        }

        #enterGameBtn {
            position: absolute;
            top: 72%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 11;
        }

        /* Canvas covers 100% of the container identically */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* Style for the video popup container */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        
        #videoOverlay video {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
        }

        /* Style for the IMG_4460 random popup overlay */
        #imagePopupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #imagePopupOverlay img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
            object-fit: contain;
        }

        /* Style for the new IMG_4464 popup overlay */
        #nextImagePopupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        #nextImagePopupOverlay img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- SHARED CONTAINER -->
    <div id="gameContainer">
        
        <!-- SCREEN 1: IMG_4461 (Sign In Screen) -->
        <div id="screenSignIn" class="screen">
            <img src="IMG_4461.jpeg" alt="World.io Sign In Screen">
            <button id="signInBtn">Sign In</button>
        </div>

        <!-- SCREEN 2: IMG_4462 (Input Screen with 3 Separated Bars) -->
        <div id="screenInput" class="screen" style="display: none;">
            <img src="IMG_4462.jpeg" alt="World.io Input Screen">
            <input type="text" id="textInput1" class="custom-input" placeholder="User...">
            <input type="password" id="textInput2" class="custom-input" placeholder="Password...">
            <input type="text" id="textInput3" class="custom-input" placeholder="Bar 3...">
            <div id="errorMessage"></div>
            <button id="enterGameBtn">Enter Game</button>
        </div>

        <!-- GAME CANVAS -->
        <canvas id="gameCanvas" width="800" height="432"></canvas>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="bgMusic" loop>
        <source src="pogosticks.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- VIDEO POPUP ELEMENT -->
    <div id="videoOverlay">
        <video id="video1" controls>
            <source src="ScreenRecording_08-17-2026 13-43-19_1.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
        <video id="video2" style="display: none;" controls>
            <source src="ScreenRecording_08-20-2026 20-30-33_1.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- RANDOM IMAGE POPUP ELEMENT (IMG_4460) -->
    <div id="imagePopupOverlay">
        <img id="popupImage" src="IMG_4460.jpeg" alt="Game Status Popup">
    </div>

    <!-- NEW IMAGE POPUP ELEMENT (IMG_4464) -->
    <div id="nextImagePopupOverlay">
        <img src="IMG_4464.jpeg" alt="Next Screen">
    </div>

    <script>
        let gameStarted = false;

        // Step 1: Click "Sign In" on IMG_4461 -> Go to IMG_4462 & trigger keyboard on first bar
        document.getElementById('signInBtn').addEventListener('click', () => {
            document.getElementById('screenSignIn').style.display = 'none';
            const screenInput = document.getElementById('screenInput');
            screenInput.style.display = 'block';

            // Automatically focus the first input field to pop open mobile keyboard
            document.getElementById('textInput1').focus();
        });

        // Step 2: Click "Enter Game" -> Validate fields, then launch audio/video media and gameplay
        function startGameAndMedia() {
            if (gameStarted) return;

            const userVal = document.getElementById('textInput1').value.trim();
            const passVal = document.getElementById('textInput2').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            // Clear previous errors
            errorDiv.textContent = "";

            // Validation checks
            if (userVal === "" && passVal === "") {
                errorDiv.textContent = "(must put user/password)";
                return;
            } else if (userVal === "") {
                errorDiv.textContent = "(must put user)";
                return;
            } else if (passVal === "") {
                errorDiv.textContent = "(must put password)";
                return;
            }

            gameStarted = true;

            // Hide the input screen
            document.getElementById('screenInput').style.display = 'none';

            // Play Animusic Background Music
            const music = document.getElementById('bgMusic');
            music.play().catch(err => {
                console.log("Audio play blocked or failed:", err);
            });

            // Show Overlay and Play Video 1
            const videoOverlay = document.getElementById('videoOverlay');
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            
            videoOverlay.style.display = 'flex';
            
            video1.play().catch(err => {
                console.log("Video 1 autoplay prevented:", err);
            });

            // When Video 1 ends, hide it and play Video 2
            video1.onended = () => {
                console.log("Video 1 ended. Starting Video 2...");
                video1.style.display = 'none';
                video2.style.display = 'block';
                video2.play().catch(err => {
                    console.log("Video 2 autoplay prevented:", err);
                });
            };

            // When Video 2 ends, check chance and show IMG_4460 or close overlay
            video2.onended = () => {
                console.log("Video 2 ended.");
                videoOverlay.style.display = 'none';

                // 999/1000 chance calculation
                const roll = Math.floor(Math.random() * 1000) + 1;
                
                if (roll <= 999) {
                    console.log("Rolled a " + roll + ". Showing IMG_4460 popup.");
                    const imagePopupOverlay = document.getElementById('imagePopupOverlay');
                    imagePopupOverlay.style.display = 'flex';
                } else {
                    console.log("Rolled a " + roll + ". Skipping popup.");
                }
            };
        }

        document.getElementById('enterGameBtn').addEventListener('click', startGameAndMedia);
        
        // Allow pressing Enter on any of the three inputs to start the game
        ['textInput1', 'textInput2', 'textInput3'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    startGameAndMedia();
                }
            });
        });

        // Handle clicking the IMG_4460 popup overlay to show IMG_4464 instead of alert
        document.getElementById('imagePopupOverlay').addEventListener('click', () => {
            document.getElementById('imagePopupOverlay').style.display = 'none';
            document.getElementById('nextImagePopupOverlay').style.display = 'flex';
        });
    </script>
</body>
</html>
