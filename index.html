<!DOCTYPE html>
<html>
<head>
    <title>World.io</title>
    <link rel="apple-touch-icon" href="IMG_4077.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #111;
            color: white;
            text-align: center;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        img {
            max-width: 50%;
            height: auto;
            border-radius: 10px;
            border: 2px solid white;
            margin-bottom: 15px;
        }
        canvas {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 1.85 / 1;
            background-color: #222;
            border: 2px solid white;
            display: block;
            margin: 10px auto;
            cursor: pointer;
        }
        #overlay {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>World.io</h1>
    
    <div id="overlay">
        <p style="margin:0; font-size:14px;">🎵 Tap anywhere or tap the game screen to start music & play!</p>
    </div>

    <br>

    <!-- 1. YOUR PICTURE -->
    <img src="IMG_4077.jpeg" alt="World.io Image">

    <br>

    <!-- 2. AUDIO ELEMENT -->
    <audio id="bgMusic" loop>
        <source src="aquaharp.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // 3. THE GAME CANVAS (1.85:1 Widescreen Ratio)
        const gameCanvas = document.createElement('canvas');
        gameCanvas.id = 'gameCanvas';
        gameCanvas.width = 800;
        gameCanvas.height = 432;
        document.body.appendChild(gameCanvas);

        // This unlocks audio on the very first touch anywhere on the page or canvas
        let musicStarted = false;
        function startAudio() {
            if (!musicStarted) {
                const music = document.getElementById('bgMusic');
                music.play().then(() => {
                    musicStarted = true;
                    // Hide the prompt once music starts
                    document.getElementById('overlay').style.display = 'none';
                }).catch(err => {
                    console.log("Waiting for interaction");
                });
            }
        }

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);
    </script>

</body>
</html>
