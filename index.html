<!DOCTYPE html>
<html>
<head>
    <title>World.io</title>
    <link rel="apple-touch-icon" href="IMG_4461.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA / App Mode Meta Tags (Removes Safari/Browser UI bars) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="World.io">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <style>
        /* Force body to take up the entire screen with zero margins */
        html, body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fullscreen Game Container */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 185vh; /* Maintains your 1.85 aspect ratio */
            max-height: 54.05vw;
            background-color: #222;
            border: 2px solid white;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Screen Wrapper Styles */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sign In Button on IMG_4461 */
        #signInBtn {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 11;
        }

        /* Smaller, Separated Input Bars on IMG_4468 */
        .custom-input {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid white;
            color: white;
            border-radius: 6px;
            width: 50%;
            max-width: 220px;
            text-align: center;
            z-index: 11;
            outline: none;
        }

        #textInput1 { top: 30%; } /* Username (Top) */
        #textInput2 { top: 41%; } /* Password (Middle) */
        #textInput3 { top: 52%; } /* Phone Number (Bottom) */

        /* Error Message Style */
        #errorMessage {
            position: absolute;
            top: 61%;
            left: 50%;
            transform: translateX(-50%);
            color: red;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            z-index: 11;
        }

        #enterGameBtn {
            position: absolute;
            top: 68%;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 11;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        #videoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        
        #videoOverlay video {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
        }

        #imagePopupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #imagePopupOverlay img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
            object-fit: contain;
        }

        #nextImagePopupOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        #nextImagePopupOverlay img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
            object-fit: contain;
        }

        #joinMessage {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #34c759;
            font-size: 20px;
            font-weight: bold;
            z-index: 1002;
            display: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
        }

        #resetAccountBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255, 59, 48, 0.8);
            color: white;
            border: 1px solid white;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <button id="resetAccountBtn">Reset Account (Test Title)</button>

    <div id="gameContainer">
        <!-- SCREEN 1: Sign In Screen -->
        <div id="screenSignIn" class="screen">
            <img src="IMG_4461.jpeg" alt="World.io Sign In Screen">
            <button id="signInBtn">Sign In</button>
        </div>

        <!-- SCREEN 2: Input Screen with IMG_4468.jpeg -->
        <div id="screenInput" class="screen" style="display: none;">
            <img src="IMG_4468.jpeg" alt="World.io Input Screen">
            <input type="text" id="textInput1" class="custom-input" placeholder="Username...">
            <input type="password" id="textInput2" class="custom-input" placeholder="Password...">
            <input type="text" id="textInput3" class="custom-input" placeholder="Phone Number...">
            <div id="errorMessage"></div>
            <button id="enterGameBtn">Enter Game</button>
        </div>

        <canvas id="gameCanvas" width="800" height="432"></canvas>
    </div>

    <audio id="bgMusic" loop>
        <source src="pogosticks.mp3" type="audio/mpeg">
    </audio>

    <div id="videoOverlay">
        <video id="video1" controls>
            <source src="ScreenRecording_08-17-2026 13-43-19_1.mov" type="video/quicktime">
        </video>
        <video id="video2" style="display: none;" controls>
            <source src="ScreenRecording_08-20-2026 20-30-33_1.mov" type="video/quicktime">
        </video>
    </div>

    <div id="imagePopupOverlay">
        <img id="popupImage" src="IMG_4460.jpeg" alt="Game Status Popup">
    </div>

    <div id="nextImagePopupOverlay">
        <div id="joinMessage"></div>
        <img src="IMG_4088.jpeg" alt="Next Screen">
    </div>

    <script>
        // Register Service Worker for offline capability
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered Successfully!"))
                .catch(err => console.log("Service Worker Registration Failed:", err));
        }

        let gameStarted = false;
        let joinMessageTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('world_io_user');
            if (savedUser) {
                document.getElementById('screenSignIn').style.display = 'none';
                document.getElementById('screenInput').style.display = 'none';
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'world_io_live_join' && event.newValue) {
                try {
                    const data = JSON.parse(event.newValue);
                    triggerJoinNotification(data.username);
                } catch (e) {
                    console.error("Error parsing live join data", e);
                }
            }
        });

        document.getElementById('resetAccountBtn').addEventListener('click', () => {
            localStorage.removeItem('world_io_user');
            location.reload();
        });

        document.getElementById('signInBtn').addEventListener('click', () => {
            document.getElementById('screenSignIn').style.display = 'none';
            const screenInput = document.getElementById('screenInput');
            screenInput.style.display = 'block';
            document.getElementById('textInput1').focus();
        });

        function startGameAndMedia() {
            if (gameStarted) return;

            const userVal = document.getElementById('textInput1').value.trim();
            const passVal = document.getElementById('textInput2').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.textContent = "";

            if (userVal === "" && passVal === "") {
                errorDiv.textContent = "(must put user/password)";
                return;
            } else if (userVal === "") {
                errorDiv.textContent = "(must put user)";
                return;
            } else if (passVal === "") {
                errorDiv.textContent = "(must put password)";
                return;
            }

            localStorage.setItem('world_io_user', userVal);
            localStorage.setItem('world_io_live_join', JSON.stringify({
                username: userVal,
                timestamp: Date.now()
            }));

            gameStarted = true;
            document.getElementById('screenInput').style.display = 'none';

            const music = document.getElementById('bgMusic');
            music.play().catch(err => console.log("Audio play blocked:", err));

            const videoOverlay = document.getElementById('videoOverlay');
            const video1 = document.getElementById('video1');
            const video2 = document.getElementById('video2');
            
            videoOverlay.style.display = 'flex';
            video1.play().catch(err => console.log("Video 1 blocked:", err));

            video1.onended = () => {
                video1.style.display = 'none';
                video2.style.display = 'block';
                video2.play().catch(err => console.log("Video 2 blocked:", err));
            };

            video2.onended = () => {
                videoOverlay.style.display = 'none';
                const roll = Math.floor(Math.random() * 1000) + 1;
                if (roll <= 999) {
                    document.getElementById('imagePopupOverlay').style.display = 'flex';
                }
            };
        }

        function triggerJoinNotification(username) {
            const joinMsg = document.getElementById('joinMessage');
            joinMsg.textContent = username + " has joined the server";
            joinMsg.style.display = 'block';
            joinMsg.style.opacity = '1';

            if (joinMessageTimer) clearTimeout(joinMessageTimer);

            joinMessageTimer = setTimeout(() => {
                joinMsg.style.opacity = '0';
                setTimeout(() => { joinMsg.style.display = 'none'; }, 500);
            }, 10000);
        }

        document.getElementById('enterGameBtn').addEventListener('click', startGameAndMedia);
        
        ['textInput1', 'textInput2', 'textInput3'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startGameAndMedia();
            });
        });

        document.getElementById('imagePopupOverlay').addEventListener('click', () => {
            document.getElementById('imagePopupOverlay').style.display = 'none';
            document.getElementById('nextImagePopupOverlay').style.display = 'flex';
            
            const savedUser = localStorage.getItem('world_io_user');
            if (savedUser) triggerJoinNotification(savedUser);
        });
    </script>
</body>
</html>
