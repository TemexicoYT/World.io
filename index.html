<!DOCTYPE html>
<html>
<head>
    <title>World.io</title>
    <link rel="apple-touch-icon" href="IMG_4077.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            background-color: #111;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        /* Container that matches the exact size of the game canvas */
        #gameContainer {
            position: relative;
            width: 90vw;
            max-width: 900px;
            aspect-ratio: 1.85 / 1;
            border: 2px solid white;
            border-radius: 10px;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Loading Screen Elements styled to fit the container */
        #loadingScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #222;
            z-index: 10;
        }

        #loadingScreen img {
            max-width: 40%;
            height: auto;
            border-radius: 10px;
            border: 2px solid white;
            margin-bottom: 15px;
        }

        #overlay {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 14px;
        }

        /* Canvas hidden initially or layered underneath */
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        /* Style for the video popup container */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        
        #videoOverlay video {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>World.io</h1>
    
    <!-- WRAPPER TO KEEP LOADING SCREEN AND CANVAS THE EXACT SAME SIZE -->
    <div id="gameContainer">
        
        <!-- LOADING SCREEN -->
        <div id="loadingScreen">
            <img src="IMG_4077.jpeg" alt="World.io Image">
            <div id="overlay">
                <p style="margin:0;">🎵 Tap anywhere to start music & play video!</p>
            </div>
        </div>

        <!-- GAME CANVAS -->
        <canvas id="gameCanvas" width="800" height="432"></canvas>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="bgMusic" loop>
        <source src="aquaharp.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- VIDEO POPUP ELEMENT -->
    <div id="videoOverlay">
        <video id="gameVideo" controls>
            <source src="ScreenRecording_08-17-2026 13-43-19_1.mov" type="video/quicktime">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        let gameStarted = false;

        function startGameAndMedia(e) {
            if (gameStarted) return;
            gameStarted = true;

            // Hide the loading screen container
            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) loadingScreen.style.display = 'none';

            // Play Background Music
            const music = document.getElementById('bgMusic');
            music.play().catch(err => {
                console.log("Audio play blocked or failed:", err);
            });

            // Show and Play Video Recording
            const videoOverlay = document.getElementById('videoOverlay');
            const gameVideo = document.getElementById('gameVideo');
            
            videoOverlay.style.display = 'flex';
            gameVideo.play().catch(err => {
                console.log("Video autoplay prevented:", err);
            });

            // When the video finishes playing, hide it so the game is ready
            gameVideo.addEventListener('ended', () => {
                videoOverlay.style.display = 'none';
            });
        }

        // Listen for the first click or touch anywhere on the page
        document.addEventListener('click', startGameAndMedia, { once: true });
        document.addEventListener('touchstart', startGameAndMedia, { once: true });
    </script>
</body>
</html>
